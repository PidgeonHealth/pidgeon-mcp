# Read-only CI for PidgeonHealth/pidgeon-mcp.
#
# Triggers only on pull_request (against the default branch) and workflow_dispatch. Never on
# push or pull_request_target. SHA provenance: ../../CONTRACT.md § 3.

name: ci

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test

      - name: Community tool-catalog parity
        run: npm run test:catalog-parity --if-present
